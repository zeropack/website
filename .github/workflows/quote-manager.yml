name: Quote Manager checks
on:
  push:
    branches: [feature/zero-pack-quote-manager]
    paths: ['apps/quote-manager/**', '.github/workflows/quote-manager.yml']
  pull_request:
    paths: ['apps/quote-manager/**', '.github/workflows/quote-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quote-manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quote-manager
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/quote-manager/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build Monday read-only candidate
        run: npm run build:monday
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quote-manager-monday-read-only-${{ github.sha }}
          path: apps/quote-manager/dist/
          retention-days: 14
